name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync web assets
        run: |
          node scripts/sync-web.js
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ArrowMaze.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArrowMaze-debug-apk
          path: ArrowMaze.apk

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Arrow Maze v1.0.0"
          body: |
            🎮 **Arrow Maze — Snake Slither Puzzle Game**
            
            - 600 Solvable Levels + 20 Shapes
            - Endless Mode & Daily Challenge
            - Pinch-to-zoom & Route Guides
            
            📥 **Download `ArrowMaze.apk` below and install directly on any Android phone!**
          files: ArrowMaze.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

