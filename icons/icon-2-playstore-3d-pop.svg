<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="popBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glossy Green Snake -->
    <linearGradient id="candyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glossy Yellow Arrow -->
    <linearGradient id="candyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glossy Pink Arrow -->
    <linearGradient id="candyPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- 3D Drop Shadow -->
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#popBg)" />
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" />

  <!-- Playful Soft Grid Circles -->
  <g fill="rgba(255,255,255,0.12)">
    <circle cx="110" cy="110" r="7" />
    <circle cx="206" cy="110" r="7" />
    <circle cx="306" cy="110" r="7" />
    <circle cx="402" cy="110" r="7" />

    <circle cx="110" cy="206" r="7" />
    <circle cx="206" cy="206" r="7" />
    <circle cx="306" cy="206" r="7" />
    <circle cx="402" cy="206" r="7" />

    <circle cx="110" cy="306" r="7" />
    <circle cx="206" cy="306" r="7" />
    <circle cx="306" cy="306" r="7" />
    <circle cx="402" cy="306" r="7" />

    <circle cx="110" cy="402" r="7" />
    <circle cx="206" cy="402" r="7" />
    <circle cx="306" cy="402" r="7" />
    <circle cx="402" cy="402" r="7" />
  </g>

  <!-- Arrow 3: Pink Snake (Bottom Left) -->
  <g filter="url(#popShadow)">
    <path d="M 110 402 L 110 306 L 240 306" fill="none" stroke="url(#candyPink)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="274,306 230,278 230,334" fill="#f43f5e" />
  </g>

  <!-- Arrow 2: Yellow Snake (Right Column) -->
  <g filter="url(#popShadow)">
    <path d="M 402 402 L 402 240" fill="none" stroke="url(#candyYellow)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="402,204 374,250 430,250" fill="#fbbf24" />
  </g>

  <!-- Arrow 1: Hero Green Snake Escaping Out Top Right -->
  <g filter="url(#popShadow)">
    <!-- Shadow tube -->
    <path d="M 110 206 L 306 206 L 306 110 L 380 110" fill="none" stroke="#047857" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" transform="translate(0, 6)" />
    <!-- Main glossy body -->
    <path d="M 110 206 L 306 206 L 306 110 L 380 110" fill="none" stroke="url(#candyGreen)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
    <!-- White Specular Spine -->
    <path d="M 118 202 L 302 202 L 302 114 L 372 114" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="414,110 364,78 364,142" fill="#34d399" />
    <polygon points="410,110 368,84 368,136" fill="url(#candyGreen)" />
  </g>

  <!-- Cheerful Star Sparkles -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M 420 80 Q 420 95 435 95 Q 420 95 420 110 Q 420 95 405 95 Q 420 95 420 80 Z" />
    <path d="M 150 140 Q 150 150 160 150 Q 150 150 150 160 Q 150 150 140 150 Q 150 150 150 140 Z" transform="scale(0.7) translate(80, 40)" />
  </g>
</svg>