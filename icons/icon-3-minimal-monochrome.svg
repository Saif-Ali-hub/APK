<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="monoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="whiteSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="crispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#monoBg)" />
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Minimal Dot Grid -->
  <g fill="#27272a" opacity="0.8">
    <circle cx="120" cy="120" r="5" />
    <circle cx="210" cy="120" r="5" />
    <circle cx="300" cy="120" r="5" />
    <circle cx="390" cy="120" r="5" />

    <circle cx="120" cy="210" r="5" />
    <circle cx="210" cy="210" r="5" />
    <circle cx="300" cy="210" r="5" />
    <circle cx="390" cy="210" r="5" />

    <circle cx="120" cy="300" r="5" />
    <circle cx="210" cy="300" r="5" />
    <circle cx="300" cy="300" r="5" />
    <circle cx="390" cy="300" r="5" />

    <circle cx="120" cy="390" r="5" />
    <circle cx="210" cy="390" r="5" />
    <circle cx="300" cy="390" r="5" />
    <circle cx="390" cy="390" r="5" />
  </g>

  <!-- Muted Arrow -->
  <g opacity="0.4" filter="url(#crispShadow)">
    <path d="M 390 390 L 390 300 L 250 300" fill="none" stroke="#71717a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="220,300 256,276 256,324" fill="#71717a" />
  </g>

  <!-- Main Pure White Arrow with Emerald Escaping Head -->
  <g filter="url(#crispShadow)">
    <path d="M 120 390 L 120 210 L 300 210 L 300 120 L 380 120" fill="none" stroke="url(#whiteSilver)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="410,120 366,92 366,148" fill="url(#emeraldAccent)" />
  </g>
</svg>