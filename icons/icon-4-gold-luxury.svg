<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyanContrast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b1" />
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#f59e0b" flood-opacity="0.35" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#goldBg)" />
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="rgba(245,158,11,0.25)" stroke-width="3" />

  <!-- Amber/Gold Grid Matrix -->
  <g fill="#44403c" opacity="0.6">
    <circle cx="120" cy="120" r="5" />
    <circle cx="210" cy="120" r="5" />
    <circle cx="300" cy="120" r="5" />
    <circle cx="390" cy="120" r="5" />

    <circle cx="120" cy="210" r="5" />
    <circle cx="210" cy="210" r="5" />
    <circle cx="300" cy="210" r="5" />
    <circle cx="390" cy="210" r="5" />

    <circle cx="120" cy="300" r="5" />
    <circle cx="210" cy="300" r="5" />
    <circle cx="300" cy="300" r="5" />
    <circle cx="390" cy="300" r="5" />

    <circle cx="120" cy="390" r="5" />
    <circle cx="210" cy="390" r="5" />
    <circle cx="300" cy="390" r="5" />
    <circle cx="390" cy="390" r="5" />
  </g>

  <!-- Cyan Contrast Arrow -->
  <g opacity="0.8">
    <path d="M 390 390 L 390 280 L 250 280" fill="none" stroke="url(#cyanContrast)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="220,280 256,256 256,304" fill="#38bdf8" />
  </g>

  <!-- Metallic Gold Hero Arrow -->
  <g filter="url(#goldGlow)">
    <path d="M 120 390 L 120 210 L 300 210 L 300 120 L 380 120" fill="none" stroke="url(#goldGradient)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Gold Crown/Star Tip -->
    <polygon points="412,120 366,92 366,148" fill="#fef08a" />
    <polygon points="408,120 370,96 370,144" fill="url(#goldGradient)" />
  </g>
</svg>