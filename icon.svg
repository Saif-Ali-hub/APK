<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="4" />
  <!-- Maze dots -->
  <g fill="#334155" opacity="0.4">
    <circle cx="128" cy="128" r="6" />
    <circle cx="192" cy="128" r="6" />
    <circle cx="256" cy="128" r="6" />
    <circle cx="320" cy="128" r="6" />
    <circle cx="384" cy="128" r="6" />
    <circle cx="128" cy="192" r="6" />
    <circle cx="192" cy="192" r="6" />
    <circle cx="256" cy="192" r="6" />
    <circle cx="320" cy="192" r="6" />
    <circle cx="384" cy="192" r="6" />
    <circle cx="128" cy="256" r="6" />
    <circle cx="192" cy="256" r="6" />
    <circle cx="256" cy="256" r="6" />
    <circle cx="320" cy="256" r="6" />
    <circle cx="384" cy="256" r="6" />
    <circle cx="128" cy="320" r="6" />
    <circle cx="192" cy="320" r="6" />
    <circle cx="256" cy="320" r="6" />
    <circle cx="320" cy="320" r="6" />
    <circle cx="384" cy="320" r="6" />
    <circle cx="128" cy="384" r="6" />
    <circle cx="192" cy="384" r="6" />
    <circle cx="256" cy="384" r="6" />
    <circle cx="320" cy="384" r="6" />
    <circle cx="384" cy="384" r="6" />
  </g>
  <!-- Slithering Arrow -->
  <g filter="url(#glow)">
    <path d="M 128 384 L 128 256 L 256 256 L 256 128 L 360 128" fill="none" stroke="url(#arrowGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="384,128 344,106 344,150" fill="#10b981" />
  </g>
  <!-- Secondary Arrow -->
  <path d="M 384 384 L 384 256 L 320 256" fill="none" stroke="#f43f5e" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <polygon points="300,256 326,240 326,272" fill="#f43f5e" opacity="0.85" />
</svg>
